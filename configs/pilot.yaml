# Konfiguracja pilotażu. Wszystko uruchamiamy na instancji Vast.ai.
# Wartości oznaczone TODO ustalamy w kroku 2 (vLLM) albo w trakcie pilotażu.

model:
  # Nazwa, pod którą vLLM serwuje model (--served-model-name); tej nazwy używają frameworki.
  served_name: qwen3.8-27b
  # Kwantyzacja W4A16 (AWQ + GPTQ, compressed-tensors) przygotowana pod vLLM; działa na RTX 4090 (Ada).
  # Brak oficjalnej 4-bitowej wersji od Qwen; NVFP4 odpada (natywnie tylko Blackwell).
  hf_repo: RedHatAI/Qwen3.8-27B-INT4
  # Na razie wyłączone; ostateczna decyzja po pilotażu. Wymuszane po stronie serwera
  # (--default-chat-template-kwargs), więc jednakowe dla wszystkich frameworków.
  enable_thinking: false

vllm:
  version: "0.34.0"             # model wymaga >= 0.17.0
  port: 8100                    # nie 8000: na szablonach Vast.ai port 8000 zajmuje ich proxy (caddy)
  # Pomiar 28.11 (RTX 3090): pula KV cache = 81 313 tokenów, więc jedna rozmowa może mieć do ~81k.
  # Limit dotyczy jednej rozmowy, nie zmienia rozmiaru puli; przebiegi idą po kolei.
  max_model_len: 65536
  gpu_memory_utilization: 0.92
  kv_cache_dtype: fp8           # ~32 KiB/token (tylko 16 z 64 warstw ma klasyczną atencję)
  max_num_seqs: 4               # przebiegi idą po kolei; mniej sekwencji = mniej pamięci na CUDA graphs
  language_model_only: true     # nie ładujemy części wizyjnej modelu
  enforce_eager: false          # true, jeśli start pada z OOM przy CUDA graphs (wolniejsze generowanie)
  tool_call_parser: qwen3_coder # w vLLM 0.34.0 qwen3_xml to alias tej samej klasy
  reasoning_parser: qwen3

generation:
  # W pilotażu temperatura nie jest istotna; ustalamy ją przed eksperymentem głównym.
  # Tymczasowo: zalecenia Qwen3.8 dla trybu bez myślenia (karta modelu).
  temperature: 0.7
  top_p: 0.8
  top_k: 20
  presence_penalty: 1.5
  max_tokens: 4096              # limit długości pojedynczej odpowiedzi modelu
  seed: 0

endpoints:
  # Adresy budowane z portów (bench/config.py):
  #   vLLM:  http://<host>:<vllm.port>/v1
  #   proxy: http://<host>:<proxy_port>/run/<run_id>/v1  (frameworki łączą się TYLKO przez proxy)
  host: 127.0.0.1
  proxy_port: 8101
  api_key: EMPTY               # vLLM nie wymaga klucza, ale klienci OpenAI chcą jakąś wartość

limits:
  max_iterations: 3             # iteracja = jedno przekazanie kodu Wykonawcy do Weryfikatora
  run_timeout_s: 600            # limit czasu przebiegu (rozważamy 300 s)
  max_llm_calls: 60             # twardy limit zapytań do modelu na przebieg; TODO: dobrać w pilotażu

sandbox:
  exec_timeout_s: 10            # limit czasu jednego uruchomienia programu (run_python / pojedynczy test)
  memory_limit_mb: 1024
  max_output_chars: 4000        # ile wyjścia programu oddajemy agentowi

tasks:
  file: data/pilot_tasks.json   # ID zadań pilotażowych (krok 3)

output:
  results_dir: results
