[project]
name = "agent-bench"
version = "0.1.0"
description = "Porównanie frameworków agentowych dla mniejszych modeli językowych uruchamianych lokalnie"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core==1.26.0",
    "agent-framework-openai==1.18.2",
    "agent-framework-orchestrations==1.4.2",
    "crewai==1.15.44",
    "fastapi==0.162.7",
    "google-adk==2.15.0",
    "httpx==0.28.1",
    "huggingface-hub==2.4.0",
    "langchain-openai==1.8.5",
    "langgraph==1.2.24",
    "litellm==1.110.2",
    "openai==2.54.0",
    "pydantic==2.12.5",
    "pyyaml==6.0.4",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench", "frameworks"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.ruff]
line-length = 120
